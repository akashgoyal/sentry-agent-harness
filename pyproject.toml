[project]
name = "sentry-agent-harness"
version = "0.1.0"
description = "Modular LangGraph + FastMCP agent harness for demoing Sentry AI Monitoring and Seer Root Cause Analysis"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sentry-sdk>=2.18",
    "langgraph>=0.2.60",
    "langchain-core>=0.3.28",
    "langchain-anthropic>=0.3.4",
    "langchain-openai>=0.2.14",
    "langchain-ollama>=0.2.2",
    "langchain-together>=0.2.0",
    "fastmcp>=2.0.0",
    "langchain-mcp-adapters>=0.0.5",
    "pydantic-settings>=2.6.1",
]

[project.scripts]
agent-harness = "agent_harness.experiments.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent_harness"]
